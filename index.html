<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MDLive — Markdown Live Editor</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/themes.css">
</head>
<body>
  <!-- Header -->
  <header class="app-header">
    <div class="header-left">
      <span class="logo">MD<span class="logo-accent">Live</span></span>
      <span class="doc-name" id="docName" contenteditable="true" spellcheck="false">untitled.md</span>
    </div>
    <div class="header-center">
      <div class="word-count" id="wordCount">0 words · 0 chars</div>
    </div>
    <div class="header-right">
      <div class="dropdown" id="langDropdown">
        <button class="dropdown-trigger" id="langBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10A15.3 15.3 0 0 1 12 2z"/></svg>
          <span id="langLabel">EN</span>
        </button>
        <div class="dropdown-menu" id="langMenu">
          <button data-lang="en" class="active">English</button>
          <button data-lang="id">Bahasa Indonesia</button>
          <button data-lang="ja">日本語</button>
          <button data-lang="ko">한국어</button>
        </div>
      </div>
      <button class="icon-btn" id="exportBtn" title="Export">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      </button>
      <button class="icon-btn" id="themeToggle" title="Toggle theme">
        <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      </button>
    </div>
  </header>

  <!-- Toolbar -->
  <div class="toolbar" id="toolbar">
    <div class="toolbar-group">
      <button class="tool-btn" data-action="heading" title="Heading">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12h8"/><path d="M4 18V6"/><path d="M12 18V6"/><path d="M21 18h-4c0-4 4-3 4-6 0-1.5-2-2.5-4-1"/></svg>
        <span class="caret">▾</span>
      </button>
      <button class="tool-btn" data-action="bold" title="Bold (Ctrl+B)">
        <strong>B</strong>
      </button>
      <button class="tool-btn" data-action="italic" title="Italic (Ctrl+I)">
        <em>I</em>
      </button>
      <button class="tool-btn" data-action="underline" title="Underline">
        <span style="text-decoration:underline">U</span>
      </button>
      <button class="tool-btn" data-action="strike" title="Strikethrough">
        <span style="text-decoration:line-through">S</span>
      </button>
    </div>
    <div class="toolbar-sep"></div>
    <div class="toolbar-group">
      <button class="tool-btn" data-action="quote" title="Blockquote">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M6 17h3l2-4V7H5v6h3zm8 0h3l2-4V7h-6v6h3z"/></svg>
      </button>
      <button class="tool-btn" data-action="code" title="Inline Code">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
      </button>
      <button class="tool-btn" data-action="codeblock" title="Code Block">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><polyline points="14 15 18 12 14 9"/><polyline points="10 9 6 12 10 15"/></svg>
      </button>
    </div>
    <div class="toolbar-sep"></div>
    <div class="toolbar-group">
      <button class="tool-btn" data-action="link" title="Insert Link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
      </button>
      <button class="tool-btn" data-action="image" title="Insert Image">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
      </button>
      <button class="tool-btn" data-action="video" title="Embed Video">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
      </button>
      <button class="tool-btn" data-action="mermaid" title="Mermaid Diagram">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="3"/><circle cx="8" cy="9" r="2"/><circle cx="16" cy="9" r="2"/><circle cx="12" cy="16" r="2"/><line x1="9.5" y1="10.5" x2="10.5" y2="14.5"/><line x1="14.5" y1="10.5" x2="13.5" y2="14.5"/></svg>
      </button>
    </div>
    <div class="toolbar-sep"></div>
    <div class="toolbar-group">
      <button class="tool-btn" data-action="ul" title="Bullet List">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
      </button>
      <button class="tool-btn" data-action="ol" title="Numbered List">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="10" y1="6" x2="21" y2="6"/><line x1="10" y1="12" x2="21" y2="12"/><line x1="10" y1="18" x2="21" y2="18"/><text x="3" y="8" font-size="8" fill="currentColor" stroke="none">1</text><text x="3" y="14" font-size="8" fill="currentColor" stroke="none">2</text><text x="3" y="20" font-size="8" fill="currentColor" stroke="none">3</text></svg>
      </button>
      <button class="tool-btn" data-action="hr" title="Horizontal Rule">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="2" y1="12" x2="22" y2="12"/></svg>
      </button>
      <button class="tool-btn" data-action="table" title="Table">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/></svg>
      </button>
    </div>
    <div class="toolbar-sep"></div>
    <div class="toolbar-group">
      <button class="tool-btn" data-action="emoji" title="Emoji Picker">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
      </button>
      <button class="tool-btn" data-action="upload" title="Upload File">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      </button>
    </div>
  </div>

  <!-- Heading submenu -->
  <div class="heading-menu" id="headingMenu">
    <button data-level="1"><span class="h-sample h1">Heading 1</span></button>
    <button data-level="2"><span class="h-sample h2">Heading 2</span></button>
    <button data-level="3"><span class="h-sample h3">Heading 3</span></button>
    <button data-level="4"><span class="h-sample h4">Heading 4</span></button>
    <button data-level="5"><span class="h-sample h5">Heading 5</span></button>
    <button data-level="6"><span class="h-sample h6">Heading 6</span></button>
  </div>

  <!-- Emoji Picker Panel -->
  <div class="emoji-picker" id="emojiPicker">
    <div class="emoji-search">
      <input type="text" id="emojiSearch" placeholder="Search emoji..." autocomplete="off">
    </div>
    <div class="emoji-categories" id="emojiCategories"></div>
    <div class="emoji-grid" id="emojiGrid"></div>
  </div>

  <!-- Link Input Modal -->
  <div class="modal-overlay" id="linkModal">
    <div class="modal">
      <h3 data-i18n="linkTitle">Insert Link</h3>
      <label data-i18n="linkText">Text</label>
      <input type="text" id="linkText" placeholder="Display text">
      <label data-i18n="linkUrl">URL</label>
      <input type="url" id="linkUrl" placeholder="https://...">
      <div class="modal-actions">
        <button class="btn btn-secondary" data-i18n="cancel" id="linkCancel">Cancel</button>
        <button class="btn btn-primary" data-i18n="insert" id="linkInsert">Insert</button>
      </div>
    </div>
  </div>

  <!-- Image Input Modal -->
  <div class="modal-overlay" id="imageModal">
    <div class="modal">
      <h3 data-i18n="imageTitle">Insert Image</h3>
      <label data-i18n="imageAlt">Alt Text</label>
      <input type="text" id="imageAlt" placeholder="Description">
      <label data-i18n="imageUrl">Image URL</label>
      <input type="url" id="imageUrl" placeholder="https://... or paste path">
      <div class="modal-divider"><span data-i18n="or">or</span></div>
      <label class="upload-area" id="imageUploadArea">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        <span data-i18n="uploadImage">Upload local image</span>
        <input type="file" id="imageFileInput" accept="image/*" hidden>
      </label>
      <div class="modal-actions">
        <button class="btn btn-secondary" data-i18n="cancel" id="imageCancel">Cancel</button>
        <button class="btn btn-primary" data-i18n="insert" id="imageInsert">Insert</button>
      </div>
    </div>
  </div>

  <!-- Video Input Modal -->
  <div class="modal-overlay" id="videoModal">
    <div class="modal">
      <h3 data-i18n="videoTitle">Embed Video</h3>
      <label data-i18n="videoUrl">Video URL (YouTube, Vimeo, etc.)</label>
      <input type="url" id="videoUrl" placeholder="https://youtube.com/watch?v=...">
      <div class="modal-actions">
        <button class="btn btn-secondary" data-i18n="cancel" id="videoCancel">Cancel</button>
        <button class="btn btn-primary" data-i18n="insert" id="videoInsert">Insert</button>
      </div>
    </div>
  </div>

  <!-- Main Editor Area -->
  <main class="editor-container">
    <div class="pane editor-pane">
      <div class="pane-header">
        <span data-i18n="editor">Editor</span>
      </div>
      <textarea id="editor" spellcheck="false" placeholder="Start writing markdown..."></textarea>
    </div>
    <div class="pane-resizer" id="paneResizer"></div>
    <div class="pane preview-pane">
      <div class="pane-header">
        <span data-i18n="preview">Preview</span>
      </div>
      <div id="preview" class="preview-content"></div>
    </div>
  </main>

  <!-- File input for toolbar upload -->
  <input type="file" id="fileUploadInput" accept=".md,.txt,.markdown" hidden>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/emoji.js"></script>
  <script src="js/editor.js"></script>
</body>
</html>
